# Debezium Server for the change-feed parity test (test_generate/cdc_debezium_parity_test.go). It publishes the
# same table the ORM does, on dbz.<db>.<table>, with the value encodings the production deployment pins.
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://nats:4222
debezium.sink.nats-jetstream.create-stream=true
debezium.sink.nats-jetstream.subjects=dbz.>

debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=mysql
debezium.source.database.port=3306
debezium.source.database.user=root
debezium.source.database.password=root
debezium.source.database.allowPublicKeyRetrieval=true
debezium.source.database.ssl.mode=disabled
debezium.source.database.server.id=5400
debezium.source.database.include.list=test
debezium.source.table.include.list=test.generateEntityParity
debezium.source.topic.prefix=dbz
debezium.source.snapshot.mode=no_data
debezium.source.snapshot.locking.mode=none
debezium.source.include.schema.changes=false
debezium.source.schema.history.internal.skip.unparseable.ddl=true
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# The encodings the ORM's codec produces and reads (cdc.go).
debezium.source.decimal.handling.mode=string
debezium.source.bigint.unsigned.handling.mode=long
debezium.source.time.precision.mode=adaptive_time_microseconds
debezium.source.binary.handling.mode=base64
debezium.source.tombstones.on.delete=false
debezium.source.converters=boolean
debezium.source.boolean.type=io.debezium.connector.binlog.converters.TinyIntOneToBooleanConverter

debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false
